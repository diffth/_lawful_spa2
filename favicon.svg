<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001835" />
      <stop offset="100%" stop-color="#003159" />
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Burgundy Accent Gradient -->
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A52A3A" />
      <stop offset="100%" stop-color="#6E1422" />
    </linearGradient>

    <!-- Outer Border Gold Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D4B8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8C6D3F" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Inner Soft Accent Ring -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Center Emblem: Scale of Justice & Shield -->
  <g transform="translate(0, 0)">
    <!-- Central Pillar -->
    <!-- Top Finial / Diamond -->
    <path d="M 256 92 L 272 118 L 256 132 L 240 118 Z" fill="url(#goldGrad)" />
    
    <!-- Central Beam -->
    <rect x="251" y="128" width="10" height="236" rx="5" fill="url(#goldGrad)" />

    <!-- Balance Horizontal Beam -->
    <path d="M 120 178 Q 256 160 392 178 Q 256 170 120 178 Z" fill="url(#goldGrad)" />
    <!-- Pivot Center Sphere -->
    <circle cx="256" cy="172" r="16" fill="url(#burgundyGrad)" stroke="url(#goldGrad)" stroke-width="4" />

    <!-- Left Scale -->
    <!-- Left Suspension Strings -->
    <line x1="126" y1="178" x2="94" y2="252" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="126" y1="178" x2="158" y2="252" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Left Pan -->
    <path d="M 82 252 Q 126 292 170 252 Z" fill="url(#goldGrad)" opacity="0.95" />
    <ellipse cx="126" cy="252" rx="44" ry="7" fill="#F3E5AB" />

    <!-- Right Scale -->
    <!-- Right Suspension Strings -->
    <line x1="386" y1="178" x2="354" y2="252" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="386" y1="178" x2="418" y2="252" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Right Pan -->
    <path d="M 342 252 Q 386 292 430 252 Z" fill="url(#goldGrad)" opacity="0.95" />
    <ellipse cx="386" cy="252" rx="44" ry="7" fill="#F3E5AB" />

    <!-- Pillar Base / Pedestal -->
    <!-- Upper Pedestal Step -->
    <path d="M 204 360 L 308 360 L 316 380 L 196 380 Z" fill="url(#goldGrad)" />
    <!-- Lower Pedestal Step -->
    <rect x="176" y="380" width="160" height="20" rx="8" fill="url(#goldGrad)" />
    <rect x="160" y="400" width="192" height="14" rx="7" fill="url(#borderGrad)" />
  </g>
</svg>
